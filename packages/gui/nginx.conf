server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Güvenlik header'ları ─────────────────────────────────────────────────
    # Clickjacking: bu sayfa iframe'de gösterilemez
    add_header X-Frame-Options "DENY" always;

    # MIME sniffing: tarayıcı Content-Type'ı tahmin etmesin
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer: cross-origin isteklerde sadece origin gönder (token sızıntısını önler)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy: gereksiz tarayıcı API'lerini kapat
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # HTTP Strict Transport Security — HTTPS zorla (1 yıl, subdomain dahil)
    # Not: sadece HTTPS arkasında (TLS terminated reverse proxy) etkinleştirin.
    # HTTP üzerinden sunulduğunda bu header tarayıcı tarafından görmezden gelinir.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content Security Policy — SPA için minimum kısıtlayıcı ama XSS'e kapalı
    # - 'unsafe-inline' style için gerekli (Tailwind inline stil); script için gerekli değil
    # - connect-src: ws: ve wss: terminal WebSocket için gerekli
    # - object-src 'none': Flash/plugin XSS vektörlerini kapat
    # - base-uri 'self': <base> tag injection saldırılarını önle
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # API proxy — HTTP ve WebSocket (terminal) için tek blok.
    # VITE_API_URL=/api ile çalışır.
    # Upgrade/Connection header'ları her istekte gönderilir;
    # normal HTTP isteklerinde bunlar boş string olur ve zararsızdır.
    location /api/ {
        proxy_pass http://api:6880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # React Router: bilinmeyen path'leri index.html'e yönlendir
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html — asla cache'leme (SPA routing için kritik)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # JS/CSS — content-hash ile versiyonlanır, güvenle cache'lenebilir
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Diğer statik dosyalar
    location ~* \.(png|jpg|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}