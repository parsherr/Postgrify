server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # API proxy — HTTP ve WebSocket (terminal) icin tek blok.
    # VITE_API_URL=/api ile calisir.
    # Upgrade/Connection header'lari her istekte gonderilir;
    # normal HTTP isteklerinde bunlar bos string olur ve zararsizdir.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # React Router: bilinmeyen path'leri index.html'e yonlendir
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html — asla cache'leme (SPA routing için kritik)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # JS/CSS — content-hash ile versiyonlanır, güvenle cache'lenebilir
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Diğer statik dosyalar
    location ~* \.(png|jpg|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
