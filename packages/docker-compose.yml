services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: packages/api/Dockerfile.monorepo
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # argon2 hash icindeki $ Docker Compose'da $$ ile escape edilir.
      # Hash'i degistirmek icin: cd packages/api && npx tsx scripts/hash-password.ts "sifre"
      # Ciktidaki her $ isaretini $$ yaparak buraya yapistir.
      ADMIN_PASSWORD_HASH: "$$argon2id$$v=19$$m=65536,t=3,p=4$$x6GWQgBkGnPjBPlNYxfn+g$$cyHdYctixJW/olyFQdvFAI9UEXwm1AAu9jghzhyLUds"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  gui:
    build:
      context: ..
      dockerfile: packages/gui/Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data: