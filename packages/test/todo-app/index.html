<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Postgrify Todo — API Test</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>
    Postgrify Todo
    <span id="connected-badge" class="connected-badge">Bağlı</span>
  </h1>
  <p class="subtitle">API entegrasyon testi · database: <code>test</code></p>

  <div id="status-bar" class="status-bar"></div>

  <!-- Bağlantı Ayarları -->
  <div class="card">
    <div class="card-title">Bağlantı</div>

    <div class="field">
      <label for="api-url">API URL</label>
      <input type="url" id="api-url" placeholder="http://localhost:3000" />
    </div>

    <div class="field">
      <label for="secret">Secret (ADMIN_SECRET veya DB_SECRET_TEST)</label>
      <input type="password" id="secret" placeholder="••••••••••••••••" />
    </div>

    <button id="connect-btn" class="btn btn-primary btn-full">Bağlan</button>
  </div>

  <!-- Todo Bölümü -->
  <div id="todo-section" class="card">
    <div class="card-title">Todolar</div>

    <div class="add-row">
      <input type="text" id="todo-input" placeholder="Yeni todo ekle…" maxlength="200" />
      <button id="add-btn" class="btn btn-primary">Ekle</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
