<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Postgrify · Image Share</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ── Navbar ── -->
<nav class="navbar">
  <div class="navbar-brand">
    <span class="navbar-logo">🖼️</span>
    <span class="navbar-title">Image Share</span>
    <span class="navbar-db" id="navbar-db"></span>
  </div>
  <div class="navbar-right">
    <span id="navbar-status" class="disconnected">Bağlı değil</span>
    <button class="btn btn-ghost btn-sm hidden" id="btn-disconnect">Çıkış</button>
  </div>
</nav>

<!-- ── Connect Section ── -->
<main class="main">
  <section class="section active" id="section-connect">
    <div class="connect-wrap">
      <div class="panel">
        <div class="panel-icon">🔌</div>
        <div>
          <div class="panel-title">Postgrify'a Bağlan</div>
          <div class="panel-desc">
            API adresini ve secret'ı gir. <code>test</code> database'i kullanılacak.
          </div>
        </div>

        <label class="field">
          <span>API URL</span>
          <input type="url" id="api-url" value="http://localhost:3000" placeholder="http://localhost:3000" />
        </label>

        <label class="field">
          <span>Secret</span>
          <input type="password" id="api-secret" placeholder="ADMIN_SECRET veya DB_SECRET_TEST" />
        </label>

        <div id="setup-log" class="setup-log hidden"></div>

        <button class="btn btn-primary btn-full" id="btn-connect">
          <span id="connect-spinner" class="spinner hidden"></span>
          Bağlan
        </button>
      </div>
    </div>
  </section>

  <!-- ── App Section ── -->
  <section class="section" id="section-app">
    <div class="app-grid">

      <!-- Upload Card -->
      <div class="upload-card">
        <div class="upload-card-title">
          ⬆️ Yeni Resim Yükle
        </div>

        <label class="field">
          <span>Başlık</span>
          <input type="text" id="upload-title" placeholder="Resim başlığı..." maxlength="120" />
        </label>

        <div class="drop-zone" id="drop-zone">
          <input type="file" id="file-input" accept="image/*" />
          <div class="drop-icon">📁</div>
          <div class="drop-text">Dosya seç veya buraya bırak</div>
          <div class="drop-hint">JPEG, PNG, WebP, GIF, SVG · Maks 10 MB</div>
        </div>

        <div class="preview-wrap" id="preview-wrap">
          <img class="preview-img" id="preview-img" src="" alt="" />
          <button class="preview-remove" id="btn-remove-preview" title="Kaldır">✕</button>
        </div>

        <div class="progress-wrap" id="progress-wrap">
          <div class="progress-bar-bg">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <div class="progress-label" id="progress-label">Yükleniyor...</div>
        </div>

        <button class="btn btn-primary btn-full" id="btn-upload" disabled>
          <span id="upload-spinner" class="spinner hidden"></span>
          Yükle
        </button>
      </div>

      <!-- Gallery -->
      <div>
        <div class="gallery-header">
          <div class="gallery-title">📷 Galeri</div>
          <div style="display:flex;gap:8px;align-items:center;">
            <span class="gallery-count" id="gallery-count"></span>
            <button class="btn btn-ghost btn-sm" id="btn-refresh">↻ Yenile</button>
          </div>
        </div>
        <div class="gallery-grid" id="gallery-grid">
          <!-- cards injected by JS -->
        </div>
      </div>

    </div>
  </section>
</main>

<!-- ── Lightbox ── -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">✕</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="" />
</div>

<!-- ── Toast container ── -->
<div id="toast-container"></div>

<script src="app.js"></script>
</body>
</html>
