<!DOCTYPE html>
<html lang="tr">
<head>

  <title>Tweeter — Postgrify Test</title>

</head>
<body>
  <div id="app">
    <div class="loading-center" style="margin-top: 100px;">
      <div class="spinner"></div>
    </div>

  <!--
    SORUN NOTU #7: DB_TOKEN burada hardcode edilmek zorunda kaldı.
    Postgrify'ın per-DB auth token'ları (auth-js ile giriş yapıldığında alınan token)
    /db/:database/rows ve /db/:database/query endpoint'lerine erişemiyor.
    Bu yüzden setup.js tarafından üretilen bir scope token kullanıyoruz.
    Gerçek bir uygulamada bu token ASLA frontend'de bulunmamalı.
  -->
  <script type="module" src="/app.js"></script>
</body>
