# Postgrify — geliştirme ortamı
# Başlatmak için: docker compose up -d
# Logları izlemek için: docker compose logs -f api

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (opsiyonel — cache ve rate limiting) ──────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Postgrify API ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # PostgreSQL
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
      PG_SSL: "false"
      # Pool
      PG_MAX_POOL_SIZE: ${PG_MAX_POOL_SIZE:-10}
      PG_POOL_IDLE_TIMEOUT: ${PG_POOL_IDLE_TIMEOUT:-30000}
      # Auth
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET is required}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
      # Rate limiting
      RATE_LIMIT_GLOBAL: ${RATE_LIMIT_GLOBAL:-1000}
      RATE_LIMIT_DB: ${RATE_LIMIT_DB:-500}
      RATE_LIMIT_ADMIN: ${RATE_LIMIT_ADMIN:-200}
      # Redis
      REDIS_URL: redis://redis:6379
      # Server
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://gui}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Postgrify GUI ───────────────────────────────────────────────────────────
  gui:
    build:
      context: ./packages/gui
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data: